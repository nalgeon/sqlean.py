name: Build and test

on:
    push:
        branches:
            - main
        tags-ignore:
            - "*"
        paths:
            - .github/**
            - sqlean/**
            - src/**
            - tests/**
            - Makefile
            - MANIFEST.in
            - pyproject.toml
            - setup.py
    pull_request:
        branches:
            - main
    workflow_dispatch:
    workflow_call:

jobs:
    sdist:
        name: Build sdist
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v7

            - name: Download SQLite and sqlean sources
              run: |
                  make prepare-src
                  make download-sqlite
                  make download-sqlean

            - name: Build sdist
              run: pipx run build --sdist

            - name: Store sdist
              uses: actions/upload-artifact@v7
              with:
                  name: sdist
                  path: dist/*.tar.gz

    wheels:
        name: Wheels on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        needs: sdist
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest # linux x86_64
                    - ubuntu-24.04-arm # linux aarch64
                    - macos-15-intel # macos x86_64
                    - macos-latest # macos arm64
                    - windows-latest # windows x86_64
        steps:
            - name: Download sdist
              uses: actions/download-artifact@v8
              with:
                  name: sdist
                  path: dist

            - name: Find sdist
              id: sdist
              shell: bash
              run: echo "path=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

            # Builds wheels from the sdist (so a broken MANIFEST.in fails here),
            # then installs each one and runs the test suite against it.
            # Configuration is in pyproject.toml.
            - name: Build and test wheels
              uses: pypa/cibuildwheel@v4.3.5
              with:
                  package-dir: ${{ steps.sdist.outputs.path }}

            - name: Store wheels
              uses: actions/upload-artifact@v7
              with:
                  name: wheels-${{ matrix.os }}
                  path: ./wheelhouse/*.whl
