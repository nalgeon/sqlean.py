name: Publish to PyPI

on:
    push:
        tags:
            - "*"
    workflow_dispatch:

jobs:
    build:
        name: Build and test
        uses: ./.github/workflows/build.yaml

    publish:
        name: Publish to PyPI
        needs: build
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - name: Download sdist
              uses: actions/download-artifact@v8
              with:
                  name: sdist
                  path: dist

            - name: Download wheels
              uses: actions/download-artifact@v8
              with:
                  pattern: wheels-*
                  path: dist
                  merge-multiple: true

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
